
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scary Gary Comics | Coming Soon</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #080605;
      display: flex;
      align-items: center;
      justify-content: center;
    }
img {
  display: block;
  width: 100%;
  max-width: 1600px;
  height: auto;

  -webkit-mask-image: linear-gradient(
    to bottom,
    transparent 0%,
    black 18%,
    black 82%,
    transparent 100%
  );

  mask-image: linear-gradient(
    to bottom,
    transparent 0%,
    black 18%,
    black 82%,
    transparent 100%
  );
}
    
/* Scary Gary neon startup */
img {
  opacity: 0;
  animation: neonStartup 4.5s linear forwards;
}

@keyframes neonStartup {
  0%, 7% {
    opacity: 0;
    filter: brightness(0);
  }

  8%, 11% {
    opacity: 1;
    filter: brightness(1.3);
  }

  12%, 20% {
    opacity: 0;
    filter: brightness(0);
  }

  21%, 24% {
    opacity: 0.8;
    filter: brightness(1);
  }

  25%, 32% {
    opacity: 0.05;
    filter: brightness(0.1);
  }

  33% {
    opacity: 0.15;
    filter: brightness(0.2);
  }

  55% {
    opacity: 0.45;
    filter: brightness(0.5);
  }

  75% {
    opacity: 0.75;
    filter: brightness(0.8);
  }

  100% {
    opacity: 1;
    filter: brightness(1);
  }
}

@media (prefers-reduced-motion: reduce) {
  img {
    animation: none;
    opacity: 1;
    filter: none;
  }
}

  </style>
</head>
<body>
  <main>
    <img src="coming-soon.png?v=2
         alt="Scary Gary Comics - Coming Soon">
  </main>
</body>
</html>
